name: Deploy node app
on:
  push:
    branches: [ practice/deployment ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push docker image
        run: |
          docker build -t "${{ secrets.DOCKER_USERNAME }}"/healthcare-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest

  deploy:
    needs: build
    runs-on: node-runner
    steps:
      - name: Pull image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest
      - name: Remove old container
        run: |
          docker stop backend || true
          docker rm backend || true
      - name: Run Docker container
        run: docker run -d -p 5000:5000 --env-file /home/ubuntu/.env --name backend ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest